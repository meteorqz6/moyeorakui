name: Publish to npm

# v로 시작하는 태그(예: v0.5.0)를 push하면 npm에 staged publish해요.
# 토큰 대신 npm Trusted Publishing(OIDC)으로 인증하므로 NPM_TOKEN이 필요 없어요.
# npmjs.com 패키지 설정의 Trusted Publisher에 이 파일 이름(publish.yml)이 등록되어 있어야 해요.
# 업로드된 버전은 바로 공개되지 않고, npmjs.com의 Staged Packages에서 2FA로 승인해야 공개돼요.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # npm Trusted Publishing(OIDC) 인증에 필요
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Staged publishing에는 npm 11.15.0 이상이 필요해요. Node 24 최신 버전에 포함된 npm이 이를 만족해요.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # 배포 빌드에는 캐시를 쓰지 않아요

      - uses: oven-sh/setup-bun@v2

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전($PKG_VERSION)이 달라요."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate styled-system
        run: bun run prepare

      # npm stage publish가 prepublishOnly를 실행하는지 보장되지 않아서, 검사와 빌드를 직접 실행해요.
      - name: Typecheck, test, build
        run: bun run typecheck && bun run test && bun run build

      - name: Stage publish
        run: npm stage publish
