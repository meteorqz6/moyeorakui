# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 리뷰 기준은 AGENTS.md다. CodeRabbit은 기본값으로 AGENTS.md를 리뷰 기준 문서로 읽는다.
# 지적마다 반영하거나 반려한 이유를 답글로 남긴다(AGENTS.md "Git").
language: ko-KR
reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_reviewers: false
  path_filters:
    - "!dist/**"
    - "!styled-system/**"
    - "!storybook-static/**"
    - "!bun.lock"
    - "!**/*.png"
  path_instructions:
    - path: "src/components/**/*.tsx"
      instructions: |
        AGENTS.md의 컴포넌트 규칙을 기준으로 본다.
        - 이름이 필요한 요소의 접근성 속성이 prop 타입에서 필수인지
        - variant 이름에 화면 이름이 들어가지 않았는지
        - 토큰 밖의 값("[36px]" 등)을 쓴 이유가 있는지
  auto_review:
    enabled: true
    drafts: false
